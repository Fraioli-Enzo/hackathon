# Prod : deploye par Coolify depuis la branche prod.
# - app Next.js en mode production (stage runner du Dockerfile, contexte ./frontend)
# - MongoDB mutualise : mongodb-global (alias DNS sur msi-shared-net), pas de mongo local
#   (le port 27017 de l'hote est deja pris par mongodb-global)
# - port publie sur 127.0.0.1 uniquement : l'acces externe passe par tunnel Cloudflare -> Traefik
# - secrets injectes via l'onglet Environment de Coolify :
#   MONGODB_URI, SESSION_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD
services:
  app:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      # Le runner est en alpine : wget (busybox) est present
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - msi-shared-net

networks:
  msi-shared-net:
    external: true
